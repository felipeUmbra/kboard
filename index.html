<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0079bf" />
    <meta name="description" content="Kboard — a Trello-inspired Kanban board backed by your Google Drive." />
    <!-- PWA: iOS Safari (16.0-16.3) ignores the manifest's "display" field
         and requires these explicit meta tags to enable standalone mode
         via "Add to Home Screen". iOS 16.4+ honors the manifest, but
         setting these too is harmless and covers older devices. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kboard" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>Kboard</title>
    <script>
      // Dev safety: unregister any stale service workers from a previous
      // build/deploy so they don't intercept Vite's HMR requests in dev.
      // Harmless in production: vite-plugin-pwa is configured with
      // devOptions.enabled:false, so no SW is ever registered in dev.
      // (The actual SW is registered from src/pwa.ts, gated on
      // import.meta.env.DEV.)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
