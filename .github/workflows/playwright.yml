name: Playwright E2E (PR)

# Fast-feedback suite that runs on every PR to `main`.
#
# This complements the deploy workflow (.github/workflows/deploy.yml):
#   - PRs targeting `main` get type-checking plus the full E2E matrix
#     (desktop, tablet, mobile and the dedicated PWA project) for fast
#     feedback before merging.
#   - Merges to `main` trigger the deploy workflow, which re-runs the
#     same tests plus the /kboard/ subpath deployment checks and blocks
#     the deploy if anything fails.

permissions:
  contents: read

# Cancel superseded PR runs to save CI minutes.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Type-checking moved here from deploy.yml so PRs get static feedback
  # without waiting for a deploy trigger (deploy.yml only runs on pushes
  # to `main`). Runs in parallel with the E2E job for fastest feedback.
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run typecheck

  # Accessibility gates that run without a browser. These are the checks
  # that catch a contrast or hardcoded-colour regression in seconds rather
  # than waiting on the E2E matrix:
  #   - a11y:contrast  — every token in tokens.css must clear 4.5:1 (or 3:1
  #     for non-text) against the worst-case background of its theme.
  #   - lint:colors    — no hardcoded colour literals outside the token file,
  #     which is how an unverified colour previously reached the UI.
  a11y:
    name: Accessibility gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run a11y

      - run: npm run test:unit

  # Sprint 4.6 — coverage gate. Kept in its own job rather than folded into
  # the a11y gates above so a coverage drop is reported as a coverage
  # failure and does not read as an accessibility regression. The thresholds
  # live in vitest.config.ts and are enforced by the runner's exit code.
  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run test:unit:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # Sprint 4.5 — cross-browser smoke. Separate from the E2E matrix so a
  # WebKit-specific failure does not block the fast Chromium feedback, and
  # so installing two extra browsers does not slow the main job. Runs a
  # deliberately small spec set (see CROSS_BROWSER_SPECS in
  # playwright.config.ts) rather than the full matrix.
  #
  # ADVISORY, NOT A MERGE GATE, while this is `continue-on-error`. WebKit's
  # headless compositor crashes under sustained load on the shared CI runner
  # and takes unrelated tests down with it. The whole WebKit set passes
  # serially, so the failures are environmental rather than product
  # defects — but an unreliable signal should report, not block. Remove this
  # line once the WebKit job runs green repeatedly.
  crossbrowser:
    name: Cross-browser smoke (Firefox + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Firefox and WebKit
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps firefox webkit

      - name: Build the app
        env:
          VITE_GOOGLE_CLIENT_ID: "placeholder.apps.googleusercontent.com"
        run: npm run build

      - name: Run cross-browser smoke tests
        env:
          CI: "true"
        run: npm run test:e2e:crossbrowser

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-crossbrowser
          path: playwright-report/
          retention-days: 14

  e2e:
    name: E2E (Chromium, desktop + tablet + mobile + PWA)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Build the app
        # A placeholder Client ID is enough — the E2E suite intercepts
        # Google Identity Services and Drive calls, never contacting real Google.
        env:
          VITE_GOOGLE_CLIENT_ID: "placeholder.apps.googleusercontent.com"
        run: npm run build

      - name: Run Playwright tests (desktop + tablet + mobile + PWA)
        # Same matrix as the deploy gate: all three viewport projects plus
        # the dedicated `pwa` project (service worker + install prompt
        # against the production preview build above).
        env:
          CI: "true"
        run: npm run test:e2e

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (screenshots, traces, video)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

# GitHub Actions requires the top-level trigger key to be `on:` (or the
# quoted form `"on":`); we use the quoted form to avoid YAML 1.1 parsers
# interpreting the bare `on` as a boolean true and flagging the file.
"on":
  pull_request:
    branches: [main]
  workflow_dispatch: