name: Playwright E2E (PR)

# Fast-feedback E2E suite that runs on every pull request.
#
# This complements the deploy workflow (.github/workflows/deploy.yml):
#   - PRs targeting `main` or `Dev` get this smoke test for fast feedback.
#   - Merges to `main` trigger the full deploy workflow, which runs the
#     same tests against all 3 viewports (desktop, tablet, mobile) and
#     blocks the deploy if anything fails.
#
# Only the desktop project runs here to keep the suite under ~3 minutes.
# The full multi-viewport run happens during the deploy gate.

permissions:
  contents: read

# Cancel superseded PR runs to save CI minutes.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Chromium, desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Build the app
        # A placeholder Client ID is enough — the E2E suite intercepts
        # Google Identity Services and Drive calls, never contacting real Google.
        env:
          VITE_GOOGLE_CLIENT_ID: "placeholder.apps.googleusercontent.com"
        run: npm run build

      - name: Run Playwright tests (desktop only)
        env:
          CI: "true"
        run: npx playwright test --project=chromium-desktop

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (screenshots, traces, video)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

# GitHub Actions requires the top-level trigger key to be `on:` (or the
# quoted form `"on":`); we use the quoted form to avoid YAML 1.1 parsers
# interpreting the bare `on` as a boolean true and flagging the file.
"on":
  pull_request:
    branches: [main, Dev]
  workflow_dispatch: