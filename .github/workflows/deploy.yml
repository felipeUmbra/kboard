name: Deploy to GitHub Pages

# Allow the workflow to write the Pages artifact and deploy it.
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid two deploys racing — cancel any in-flight run for the same branch.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Stage 1 — Static checks (fast feedback)
  # ──────────────────────────────────────────────────────────────────
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  # ──────────────────────────────────────────────────────────────────
  # Stage 2 — End-to-end tests against the dev server
  #   Runs against `npm run dev` so HMR + Vite-optimized source is
  #   exercised (closer to what local devs run). Output artifacts
  #   (HTML report, screenshots, traces) are uploaded on every run,
  #   even on failure, so failures are debuggable from the GH UI.
  # ──────────────────────────────────────────────────────────────────
  e2e:
    name: E2E (Chromium, desktop + tablet + mobile)
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Build the app
        # The E2E suite uses the dev server (`npm run dev`) via
        # `playwright.config.ts -> webServer.command`, so we don't need to
        # build for tests to run. We still build once here so cache reuse
        # works in subsequent jobs.
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "${VITE_GOOGLE_CLIENT_ID:-}" ]; then
            echo "::warning::VITE_GOOGLE_CLIENT_ID secret is not set — using a placeholder so the build still succeeds."
            export VITE_GOOGLE_CLIENT_ID="placeholder.apps.googleusercontent.com"
          fi
          npm run build

      - name: Run Playwright tests
        env:
          CI: "true"
        run: npm run test:e2e

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (screenshots, traces, video)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  # Stage 3 — Build production bundle (gated on typecheck + tests)
  # ──────────────────────────────────────────────────────────────────
  build:
    name: Build production bundle
    needs: [typecheck, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          BASE_PATH: "/${{ github.event.repository.name }}/"
        run: |
          if [ -z "${VITE_GOOGLE_CLIENT_ID:-}" ]; then
            echo "::error::VITE_GOOGLE_CLIENT_ID secret is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          npm run build

      - name: Verify PWA artifacts
        # Cheap insurance: the manifest and service worker must be in
        # the build output, or the install prompt and offline shell
        # are silently broken in production. This fails the build
        # loudly instead of shipping a half-broken PWA.
        run: |
          test -f dist/manifest.webmanifest || { echo "::error::dist/manifest.webmanifest is missing"; exit 1; }
          test -f dist/sw.js                || { echo "::error::dist/sw.js is missing"; exit 1; }
          test -f dist/share-capture.html   || { echo "::error::dist/share-capture.html is missing (share_target needs it)"; exit 1; }
          test -f dist/icons/icon-192.png   || { echo "::error::dist/icons/icon-192.png is missing"; exit 1; }
          test -f dist/icons/icon-512.png   || { echo "::error::dist/icons/icon-512.png is missing"; exit 1; }
          test -f dist/icons/apple-touch-icon.png || { echo "::error::dist/icons/apple-touch-icon.png is missing"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ──────────────────────────────────────────────────────────────────
  # Stage 4 — Deploy to GitHub Pages (gated on build)
  # ──────────────────────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Trigger configuration. GitHub Actions requires the top-level key
# to be `on:` (or the quoted form `"on":`); we use the quoted form so
# YAML 1.1 parsers (and editor preview / diff renderers such as Cline's
# edit preview, which re-render the file before parsing) don't interpret
# the bare `on` as a boolean `true` and flag line 2 with "Expected a
# scalar value, a sequence, or a mapping". The trigger is placed at
# the bottom of the document to keep it away from the "first key after
# the top-level scalar" slot that triggers the false positive.
"on":
  push:
    branches: [main]
  workflow_dispatch: