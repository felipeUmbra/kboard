name: Deploy to GitHub Pages

# Allow the workflow to write the Pages artifact and deploy it.
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid two deploys racing — cancel any in-flight run for the same branch.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Build
        # Pass a placeholder Client ID so the build doesn't fail. The real
        # value is provided at runtime via the GH Pages environment
        # (see "Hardening the OAuth setup" in the README for instructions
        # on how to inject it before deploying).
        # BASE_PATH is set so the built app works under
        # https://<owner>.github.io/<repo>/. If you're deploying to a
        # custom domain or to a user/org root, override BASE_PATH to "/".
        # NOTE: We deliberately use the env: block (not an inline shell
        # expression) so the static schema linter can resolve
        # `secrets.VITE_GOOGLE_CLIENT_ID` and stop flagging it as
        # "Context access might be invalid". GitHub Actions evaluates
        # this expression identically to the previous form.
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          BASE_PATH: "/${{ github.event.repository.name }}/"
        run: |
          if [ -z "${VITE_GOOGLE_CLIENT_ID:-}" ]; then
            echo "::error::VITE_GOOGLE_CLIENT_ID secret is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Trigger configuration. GitHub Actions requires the top-level key
# to be `on:` (or the quoted form `"on":`); we use the quoted form so
# YAML 1.1 parsers (and editor preview / diff renderers such as Cline's
# edit preview, which re-render the file before parsing) don't interpret
# the bare `on` as a boolean `true` and flag line 2 with "Expected a
# scalar value, a sequence, or a mapping". The trigger is placed at
# the bottom of the document to keep it away from the "first key after
# the top-level scalar" slot that triggers the false positive.
"on":
  push:
    branches: [main]
  workflow_dispatch:
