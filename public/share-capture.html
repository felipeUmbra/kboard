<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kboard</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f4f5f7; color: #172b4d;
                   font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, "Helvetica Neue", Arial, sans-serif; }
      body { display: flex; align-items: center; justify-content: center; }
      .wrap { text-align: center; padding: 24px; }
      .spinner { display: inline-block; width: 32px; height: 32px;
                 border: 3px solid #dfe1e6; border-top-color: #0079bf;
                 border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      p { margin-top: 16px; color: #5e6c84; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner" aria-hidden="true"></div>
      <p>Opening Kboard&hellip;</p>
    </div>
    <script>
      // share-capture.html is the POST target for the PWA "share_target".
      //
      // Why this page exists:
      //   GitHub Pages returns 404 for any unknown path with a POST body.
      //   Without a real backend, the share payload would be lost.
      //   This page is registered as a Workbox navigation fallback for the
      //   /?share=1 share endpoint, so the SW serves it instead of the 404.
      //   The page reads the URL the SW redirected us to (?share=<id>), writes
      //   the shared content (carried via query string in the action URL) into
      //   IndexedDB under <id>, then redirects to /?share=<id> as a normal GET.
      //
      // The action URL is: /share-capture.html?id=<id>
      // The shared fields are appended to the action URL by the Web App
      // Manifest "share_target" spec (title/text/url become query params on
      // the action when the runtime supports it; Chrome implements this).
      (function () {
        try {
          var params = new URLSearchParams(location.search);
          var id = params.get("id") || (function () {
            // Fallback: generate a unique ID if none was provided.
            return "s-" + Date.now().toString(36) + "-" +
                   Math.random().toString(36).slice(2, 8);
          })();
          var payload = {
            title: params.get("title") || "",
            text:  params.get("text")  || "",
            url:   params.get("url")   || "",
            ts:    Date.now(),
          };
          // IndexedDB write. The app reads it back on /?share=<id> mount.
          var req = indexedDB.open("kboard-share", 1);
          req.onupgradeneeded = function (e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains("pending")) {
              db.createObjectStore("pending", { keyPath: "id" });
            }
          };
          req.onsuccess = function (e) {
            var db = e.target.result;
            var tx = db.transaction("pending", "readwrite");
            tx.objectStore("pending").put({ id: id, payload: payload });
            tx.oncomplete = function () {
              // Normalize to a clean URL the SPA's App.tsx can read.
              location.replace("/?share=" + encodeURIComponent(id));
            };
            tx.onerror = function () {
              location.replace("/");
            };
          };
          req.onerror = function () { location.replace("/"); };
        } catch (err) {
          // If anything goes wrong, fall back to the app root.
          location.replace("/");
        }
      })();
    </script>
  </body>
</html>
